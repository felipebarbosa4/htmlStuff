name: Finance authorization and kiosk safety
on:
  pull_request:
    paths:
      - 'family-dashboard/**'
      - 'functions/**'
      - 'tests/finance.test.mjs'
      - '.github/workflows/finance-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Finance unit and access tests
        run: node --test tests/finance.test.mjs
