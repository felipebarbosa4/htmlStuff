<script>
'use strict';
const TZ='America/Toronto';const BASE='../kids-weather-panel/?v=5';
let activitiesSavedView=null;
let manual='auto',visible='',manualUntil=0,calendarEvents=[],calendarUpcoming=[],calendarLoaded=false,calendarPage=0,calendarPageTotal=1;
const MANUAL_DURATION=30*60*1000;
function parts(){const s=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23',weekday:'short',month:'short',day:'numeric'}).formatToParts(new Date());return Object.fromEntries(s.filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));}
// Collection eve 20:00–00:00; collection morning 08:45–10:00.
// Clothes retain priority 08:00–08:45 on collection days and 08:00–08:50 otherwise.
// Brazilian lunch suggestions: 11:30–13:00, unless a timed appointment
// overlaps 11:30–13:00 or starts precisely at 13:00. Calendar wins on uncertainty.
const LUNCH_START=690,LUNCH_END=780;
const lunchCalendar={date:'',verifiedAt:0,hasConflict:true,loading:false,nextAttemptAt:0};
const lunchClockParts=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function lunchLocalMinute(value){
 const time=new Date(value);
 if(!Number.isFinite(time.getTime()))return '';
 const a=Object.fromEntries(lunchClockParts.formatToParts(time).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));
 return a.year+'-'+a.month+'-'+a.day+'T'+a.hour+':'+a.minute;
}
function lunchConflicts(events,date){
 const from=date+'T11:30',through=date+'T13:00';
 return events.some(e=>{
  if(e.allDay || !e.start)return false; // Birthdays and other all-day entries should not hide lunch.
  const start=lunchLocalMinute(e.start),end=lunchLocalMinute(e.end||e.start);
  return Boolean(start&&end&&start<=through&&(end>from || (start===end && start>=from)));
 });
}
function lunchIsVerifiedFree(){
 return lunchCalendar.date===ottawaDate()&&!lunchCalendar.hasConflict&&
  lunchCalendar.verifiedAt>0&&Date.now()-lunchCalendar.verifiedAt<15*60*1000;
}
function which(p){const min=Number(p.hour)*60+Number(p.minute);if(typeof window!=='undefined'&&window.WastePanel?.slot(p))return 'waste';if(min>=1320||min<360)return 'night';if(min>=480&&min<530)return 'weather';if(min>=690&&min<780)return lunchIsVerifiedFree()?'meals':'calendar';return 'calendar';}
function setUI(mode){
const el=document.getElementById('stage');
if(mode==='activities' && activitiesSavedView){
  el.replaceChildren(activitiesSavedView);
  if(window.ActivitiesPanel?.resume)ActivitiesPanel.resume();
  return;
}
el.replaceChildren();
if(mode==='activities'){
  const view=document.createElement('section');view.className='activities-mount';
  activitiesSavedView=view;el.appendChild(view);
  if(window.ActivitiesPanel)ActivitiesPanel.mount(view,()=>visible==='activities');
  return;
}
if(mode==='todos'){const view=document.createElement('section');view.className='todos-mount';el.appendChild(view);window.TodosPanel?.mount(view);return;}
if(mode==='finance'){const view=document.createElement('section');view.className='view';el.appendChild(view);if(window.FinancePanel)FinancePanel.mount(view,()=>visible==='finance');else view.innerHTML='<h1>Finance temporarily unavailable</h1><p class="dim">Try refreshing the page. The calendar and automatic schedule remain available.</p>';return;}
if(mode==='waste'){const view=document.createElement('section');view.className='waste-mount';el.appendChild(view);if(window.WastePanel)WastePanel.mount(view,()=>{manual='auto';visible='';render();});else view.textContent='Calendário de coleta indisponível.';return;}
if(mode==='meals'){const view=document.createElement('section');view.className='meals-mount';el.appendChild(view);if(window.MealsPanel)MealsPanel.mount(view);else view.textContent='Refeições temporariamente indisponíveis.';return;}
if(mode==='weather'){const f=document.createElement('iframe');f.id='frame';f.src=BASE+'&refresh='+Date.now();f.title='Children clothing recommendations for Ottawa';el.appendChild(f);return;}
const view=document.createElement('section');view.className='view';el.appendChild(view);
if(mode==='calendar'){view.classList.add('calendar-screen');calendarPage=0;view.innerHTML='<div class="small">FAMILY SCHEDULE · 06:00–22:00 (EXCEPT 08:00–08:50)</div><h1 class="big">📅 Family calendar</h1><div class="next-up" aria-label="Next appointment"><div class="next-label">⏭ NEXT UP</div><div class="next-title" id="next-title">Finding your next appointment…</div><div class="next-meta" id="next-meta"></div><div class="next-countdown" id="next-countdown"></div></div><div class="calendar-info dim" id="calendar-info">Connecting to your calendars…</div><div class="calendar-connection" id="calendar-connection" role="status" hidden></div><div id="calendar-events" class="agenda" aria-live="polite" tabindex="0" aria-label="Deslize horizontalmente para ver mais compromissos"></div><p class="foot">Read-only agenda · Ottawa time · All readable calendars · Updates every 10 minutes</p>';calendarRenderedMinute=-1;calendarNextAttemptAt=0;if(calendarLoaded && calendarDataDate===ottawaDate()){const info=view.querySelector('#calendar-info');if(info)info.textContent='Last successful update '+calendarClock(calendarLastSync)+' · reconnecting';updateNextUp();drawCalendarList(view);}enableCalendarSwipe(view);loadCalendar(view);}
else view.innerHTML='<div class="small">NIGHT MODE · 22:00–06:00</div><div class="clock" id="large-clock">--:--</div><h1>🌙 Good night!</h1><p class="dim">Your family schedule returns automatically at 6:00 AM.</p>';
}

// In-memory only: private calendar entries are never written to browser storage.
let calendarUpdatedAt=0,calendarNextAttemptAt=0,calendarLoading=false;
let calendarRetryCount=0,calendarLastSync=0,calendarDataDate='',calendarRenderedMinute=-1;
function ottawaDate(){
 const parts=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
 const p=Object.fromEntries(parts.filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));
 return p.year+'-'+p.month+'-'+p.day;
}
// Check the Google Calendar before lunch and throughout lunch, without persisting
// private event details in storage. Fail closed to Calendar on errors or partial results.
async function refreshLunchCalendar(p){
 const minute=Number(p.hour)*60+Number(p.minute);
 if(minute<675 || minute>=LUNCH_END)return; // preflight starts at 11:15
 const date=ottawaDate(),now=Date.now();
 if(lunchCalendar.date!==date){
  lunchCalendar.date=date;lunchCalendar.verifiedAt=0;
  lunchCalendar.hasConflict=true;lunchCalendar.nextAttemptAt=0;
 }
 if(lunchCalendar.loading||now<lunchCalendar.nextAttemptAt)return;
 lunchCalendar.loading=true;
 lunchCalendar.nextAttemptAt=now+5*60*1000;
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),25000);
 try{
  const response=await fetch('/api/calendar?date='+encodeURIComponent(date),{
   credentials:'same-origin',cache:'no-store',redirect:'manual',signal:controller.signal
  });
  if(response.type==='opaqueredirect'||!response.ok||
     !response.headers.get('content-type')?.includes('application/json'))
    throw new Error('Calendar is not accessible');
  const data=await response.json();
  if(data.date!==date||data.partial||!Array.isArray(data.events))
    throw new Error('Calendar could not be fully verified');
  if(ottawaDate()!==date)return;
  lunchCalendar.hasConflict=lunchConflicts(data.events,date);
  lunchCalendar.verifiedAt=Date.now();
 }catch{
  // An expired login or incomplete calendar must not hide a possible appointment.
  lunchCalendar.hasConflict=true;lunchCalendar.verifiedAt=0;
  lunchCalendar.nextAttemptAt=Date.now()+60*1000;
 }finally{
  clearTimeout(timer);lunchCalendar.loading=false;
  if(manual==='auto')render();
 }
}
function eventTime(date){
 const d=new Date(date);
 return Number.isFinite(d.valueOf())?new Intl.DateTimeFormat('en-CA',{timeZone:TZ,hour:'numeric',minute:'2-digit',hour12:true}).format(d):'Time unavailable';
}
function updateNextUp(now=Date.now()){
 if(!calendarLoaded||visible!=='calendar')return;
 const title=document.getElementById('next-title'),meta=document.getElementById('next-meta'),countdown=document.getElementById('next-countdown');
 if(!title||!meta||!countdown)return;
 const timed=[...calendarEvents,...calendarUpcoming]
   .filter(e=>!e.allDay&&Number.isFinite(Date.parse(e.start))&&Date.parse(e.start)>now)
   .sort((a,b)=>Date.parse(a.start)-Date.parse(b.start));
 const next=timed[0];
 if(!next){title.textContent='No upcoming appointments found';meta.textContent='No timed appointments found in the next 30 days.';countdown.textContent='';return;}
 const t=Date.parse(next.start),minutes=Math.max(0,Math.ceil((t-now)/60000));
 title.textContent=next.title||'Busy';
 meta.textContent=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',hour12:true}).format(t)+' · '+(next.calendar||'Calendar')+(next.location?' · '+next.location:'');
 const hours=Math.floor(minutes/60),days=Math.floor(hours/24);
 countdown.textContent=minutes<60?'In '+minutes+' min':hours<24?'In '+hours+' hr'+(minutes%60?' '+minutes%60+' min':''):'In '+days+' day(s)'+(hours%24?' '+hours%24+' hr':'');
}
function connectionMessage(view,message,requiresLogin=false){
 const target=view.querySelector('#calendar-connection');
 if(!target)return;
 target.hidden=!message;
 target.textContent=message||'';
 target.classList.toggle('auth',requiresLogin);
}
function enableCalendarSwipe(view){
 const target=view.querySelector('#calendar-events');
 if(!target)return;
 let start=null;
 const changePage=direction=>{
  const next=Math.max(0,Math.min(calendarPageTotal-1,calendarPage+direction));
  if(next===calendarPage)return;
  calendarPage=next;calendarRenderedMinute=-1;drawCalendarList(view);
 };
 target.addEventListener('pointerdown',event=>{
  if(event.isPrimary===false)return;
  start={x:event.clientX,y:event.clientY};
 });
 target.addEventListener('pointerup',event=>{
  if(!start)return;
  const dx=event.clientX-start.x,dy=event.clientY-start.y;
  start=null;
  if(Math.abs(dx)>=60&&Math.abs(dx)>Math.abs(dy)*1.35)changePage(dx<0?1:-1);
 });
 target.addEventListener('pointercancel',()=>{start=null;});
 target.addEventListener('keydown',event=>{
  if(event.key!=='ArrowLeft'&&event.key!=='ArrowRight')return;
  event.preventDefault();changePage(event.key==='ArrowRight'?1:-1);
 });
}
function drawCalendarList(view,now=Date.now()){
 if(!calendarLoaded||!view?.isConnected||visible!=='calendar')return;
 const minute=Math.floor(now/60000);
 if(calendarRenderedMinute===minute)return;
 calendarRenderedMinute=minute;
 const target=view.querySelector('#calendar-events');
 if(!target)return;
 target.replaceChildren();
 const events=calendarEvents.filter(e=>e.allDay||(Number.isFinite(Date.parse(e.end||e.start))&&Date.parse(e.end||e.start)>now));
 if(!events.length){
  calendarPageTotal=1;
  const empty=document.createElement('div');empty.className='agenda-empty';
  empty.textContent='No more appointments today. The next upcoming appointment is shown above.';
  target.appendChild(empty);return;
 }
 const available=target.clientHeight||360;
 const pageSize=Math.max(1,Math.floor((available-82)/80));
 const totalPages=Math.max(1,Math.ceil(events.length/pageSize));
 calendarPageTotal=totalPages;
 calendarPage=Math.max(0,Math.min(calendarPage,totalPages-1));
 if(totalPages>1){
   const bar=document.createElement('div');bar.className='calendar-page-controls';
   const counter=document.createElement('span');
   counter.textContent='Deslize ← → · Compromissos '+(calendarPage*pageSize+1)+'–'+Math.min(events.length,(calendarPage+1)*pageSize)+' de '+events.length;
   bar.append(counter);target.appendChild(bar);
 }
 let placedAllDay=false,placedTimed=false;
 for(const event of events.slice(calendarPage*pageSize,(calendarPage+1)*pageSize)){
  if(event.allDay&&!placedAllDay){placedAllDay=true;const h=document.createElement('div');h.className='agenda-all-day';h.textContent='ALL DAY';target.appendChild(h);}
  if(!event.allDay&&!placedTimed){placedTimed=true;const h=document.createElement('div');h.className='agenda-all-day';h.textContent='APPOINTMENTS';target.appendChild(h);}
  const row=document.createElement('article');row.className='agenda-row';
  const time=document.createElement('div');time.className='agenda-time';
  time.textContent=event.allDay?'All day':eventTime(event.start)+(event.end?' – '+eventTime(event.end):'');
  const card=document.createElement('div');card.className='agenda-event';
  if(/^#[0-9a-fA-F]{6}$/.test(event.color||''))card.style.borderLeftColor=event.color;
  const title=document.createElement('h2');title.textContent=event.title||'Busy';
  const sub=document.createElement('div');sub.className='agenda-meta';
  sub.textContent=(event.calendar||'Calendar')+(event.location?' · '+event.location:'');
  card.append(title,sub);row.append(time,card);target.appendChild(row);
 }
}
function calendarClock(time){
 return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,hour:'numeric',minute:'2-digit',hour12:true}).format(time);
}
async function loadCalendar(view){
 if(calendarLoading||!view?.isConnected||visible!=='calendar')return;
 const info=view.querySelector('#calendar-info');
 const target=view.querySelector('#calendar-events');
 if(!info||!target)return;
 const date=ottawaDate();
 if(calendarDataDate&&calendarDataDate!==date){
  // Never display a previous day's appointments as though they were today's.
  calendarLoaded=false;calendarEvents=[];calendarUpcoming=[];
  calendarLastSync=0;calendarDataDate='';calendarRenderedMinute=-1;
 }
 calendarLoading=true;
 calendarUpdatedAt=Date.now();
 if(!calendarLoaded)info.textContent='Connecting to your family calendars…';
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),25000);
 try{
  // Manual redirect reveals expired Cloudflare Access without a cross-origin CORS failure.
  const resp=await fetch('/api/calendar?date='+encodeURIComponent(date),{
   credentials:'same-origin',cache:'no-store',redirect:'manual',signal:controller.signal
  });
  if(resp.type==='opaqueredirect') {
   const error=new Error('Cloudflare Access login needs renewal.');
   error.needsLogin=true;throw error;
  }
  if(!resp.headers.get('content-type')?.includes('application/json')){
   const error=new Error('Cloudflare Access session may have expired.');
   error.needsLogin=true;throw error;
  }
  const data=await resp.json();
  if(!resp.ok){
   const error=new Error(data.error||'Calendar API HTTP '+resp.status);
   error.needsLogin=resp.status===401||resp.status===403;throw error;
  }
  if(!view.isConnected||visible!=='calendar')return;
  calendarEvents=Array.isArray(data.events)?data.events:[];
  calendarUpcoming=Array.isArray(data.upcomingEvents)?data.upcomingEvents:[];
  calendarLoaded=true;calendarDataDate=date;calendarLastSync=Date.now();
  calendarRetryCount=0;calendarNextAttemptAt=Date.now()+10*60*1000;
  calendarRenderedMinute=-1;
  const eventCount=Number.isFinite(Number(data.eventCount))?data.eventCount:calendarEvents.length;
  info.textContent=eventCount+' event'+(eventCount===1?'':'s')+' today · '+data.calendarCount+' calendars · updated '+calendarClock(calendarLastSync);
  connectionMessage(view,data.partial?'Some calendars could not be loaded. Automatic refresh is active.':'');
  updateNextUp();drawCalendarList(view);
 }catch(error){
  if(!view.isConnected||visible!=='calendar')return;
  calendarRetryCount++;
  const backoff=Math.min(120000,15000*Math.pow(2,Math.min(calendarRetryCount-1,3)));
  calendarNextAttemptAt=Date.now()+backoff;
  const requiresLogin=Boolean(error.needsLogin);
  const retryText='Automatic retry in '+Math.ceil(backoff/1000)+' seconds.';
  const reason=requiresLogin?'Cloudflare login expired. Open the dashboard in Fully Kiosk and sign in again.':
   error.name==='AbortError'?'Calendar request timed out.': 'Wi-Fi, internet or Cloudflare connection unavailable.';
  if(calendarLoaded && calendarDataDate===date){
   // Keep the previously loaded appointments visible, marked as potentially stale.
   info.textContent='Last successful update '+calendarClock(calendarLastSync)+' · reconnecting';
   connectionMessage(view,reason+' Showing the last loaded appointments; changes may be missing. '+retryText,requiresLogin);
   updateNextUp();
  }else{
   calendarLoaded=false;
   info.textContent='Calendar connection needs attention · reconnecting';
   const title=view.querySelector('#next-title'),meta=view.querySelector('#next-meta'),countdown=view.querySelector('#next-countdown');
   if(title)title.textContent='Connecting to your calendar…';
   if(meta)meta.textContent='No appointments loaded yet';
   if(countdown)countdown.textContent='';
   target.replaceChildren();
   connectionMessage(view,reason+' '+retryText,requiresLogin);
  }
 }finally{
  clearTimeout(timeout);
  calendarLoading=false;
 }
}

// Refresh the page once each Ottawa day after 05:55, before the morning calendar.
// Store only the last-refresh date, never Google credentials or event content.
function refreshDaily(p){
 const min=Number(p.hour)*60+Number(p.minute);
 if(min<355||min>=1320||manual!=='auto')return;
 const key='family-dashboard:kiosk-reload-date',today=ottawaDate();
 try{
   const previous=localStorage.getItem(key);
   if(previous===today)return;
   localStorage.setItem(key,today);
   if(previous && localStorage.getItem(key)===today)window.location.reload();
 }catch(e){ /* Storage is optional; the live schedule keeps running. */ }
}
function render(){
 const p=parts(),now=Date.now();
 document.getElementById('now').textContent=p.weekday+', '+p.month+' '+p.day+' · '+p.hour+':'+p.minute+' · Ottawa';
 if(manual!=='auto'&&now>=manualUntil){manual='auto';manualUntil=0;}
 refreshDaily(p);
 window.TodosPanel?.tick(p);
 refreshLunchCalendar(p);
 const selected=manual==='auto'?which(p):manual;
 if(selected!==visible){if(visible==='finance'&&window.FinancePanel)FinancePanel.lock();visible=selected;setUI(selected);}
 if(window.FinancePanel)FinancePanel.tick(now);
 if(selected==='calendar'){
   const v=document.querySelector('#stage .view');
   if(v && !calendarLoading && (now>=calendarNextAttemptAt || (calendarDataDate && calendarDataDate!==ottawaDate())))loadCalendar(v);
   if(v)drawCalendarList(v,now);
   updateNextUp(now);
 }
 const c=document.getElementById('large-clock');if(c)c.textContent=p.hour+':'+p.minute;
 for(const b of document.querySelectorAll('[data-mode]')){b.classList.toggle('current',b.dataset.mode===manual);b.setAttribute('aria-pressed',String(b.dataset.mode===manual));}
}
for(const b of document.querySelectorAll('[data-mode]'))b.addEventListener('click',()=>{
 manual=b.dataset.mode;manualUntil=manual==='auto'?0:Date.now()+MANUAL_DURATION;
 visible='';render();
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){calendarNextAttemptAt=0;render();}});
window.addEventListener('online',()=>{calendarNextAttemptAt=0;window.WastePanel?.refresh(true);window.MealsPanel?.refresh(true);render();});
window.addEventListener('waste-calendar-updated',()=>{if(manual==='auto')render();});
window.addEventListener('pageshow',event=>{if(event.persisted){calendarNextAttemptAt=0;render();}});
window.addEventListener('resize',()=>{
 if(visible==='calendar'){calendarRenderedMinute=-1;drawCalendarList(document.querySelector('#stage .calendar-screen'));}
});
// Read-only bridge for the independent voice module. Private Finance is excluded.
window.familyDashboardVoice=Object.freeze({
 showScreen(name){
  if(!['auto','weather','calendar','night','activities','waste','meals','todos'].includes(name))return false;
  const button=document.querySelector('[data-mode="'+name+'"]');
  if(!button)return false;
  button.click();
  return true;
 },
 upcoming(){
  if(!calendarLoaded)return null;
  return [...calendarEvents,...calendarUpcoming].map(e=>({
   title:String(e.title||'Compromisso').slice(0,100),start:e.start,allDay:Boolean(e.allDay)
  }));
 }
});
if('serviceWorker' in navigator){
 window.addEventListener('load',()=>navigator.serviceWorker.register('/family-dashboard/sw.js',{scope:'/family-dashboard/'}).catch(()=>{}));
}
setInterval(render,15000);render();
</script>
