<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a1426">
<title>Family Smart Dashboard</title>
<style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#eef6ff;background:#091424}*{box-sizing:border-box}html,body{margin:0;min-height:100%;}body{display:flex;flex-direction:column;min-height:100vh}.top{padding:12px 18px;display:flex;gap:16px;align-items:center;justify-content:space-between;border-bottom:1px solid #344660;background:#12243b;flex-wrap:wrap}.brand{font-size:18px;font-weight:800}.small{color:#adc0d5;font-size:14px}.controls{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.controls button{border:1px solid #53728e;color:#d4e8ff;background:#1e3552;padding:9px 12px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}.controls button.current{color:#062323;background:#73eadb;border-color:#73eadb}#stage{position:relative;flex:1;min-height:65vh}#frame{width:100%;height:calc(100vh - 74px);border:0;background:#091424}.view{padding:clamp(20px,4vw,52px);max-width:1200px;margin:auto}.big{font-size:clamp(33px,6vw,70px);margin:10px 0}.card{border-radius:22px;border:1px solid #405b7a;background:#19304c;padding:25px;max-width:800px;margin:20px 0}.dim{color:#b4c8df}.clock{font-size:clamp(44px,10vw,120px);font-weight:800;font-variant-numeric:tabular-nums}.notice{border-left:4px solid #73eadb;padding:12px 16px;background:#193047}.actions a{display:inline-block;color:#092527;background:#73eadb;padding:14px 18px;border-radius:12px;text-decoration:none;font-weight:800}.hint{line-height:1.7}.foot{font-size:13px;color:#b4c8df;margin-top:20px}@media(max-width:750px){.top{padding:10px}.controls button{padding:9px}#frame{height:calc(100vh - 116px)}}
</style></head>
<body>
<header class="top"><div><div class="brand">🏠 Family Smart Dashboard</div><div class="small" id="now">Ottawa local time</div></div><nav class="controls" aria-label="Preview panels"><button data-mode="auto" class="current">Automatic</button><button data-mode="weather">Clothes</button><button data-mode="calendar">Calendar</button><button data-mode="meals">Meals</button><button data-mode="night">Night</button></nav></header>
<main id="stage" aria-live="polite"></main>
<script>
'use strict';
const TZ='America/Toronto';const BASE='../kids-weather-panel/?v=5';
let manual='auto', visible='',tickCount=0;
const stages={weather:'8:00–9:00 AM',calendar:'9:00 AM–5:00 PM',meals:'5:00–7:00 PM',night:'After 7:00 PM'};
function parts(){const s=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23',weekday:'short',month:'short',day:'numeric'}).formatToParts(new Date());return Object.fromEntries(s.filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));}
function which(p){const min=Number(p.hour)*60+Number(p.minute);if(min>=480&&min<540)return 'weather';if(min>=540&&min<1020)return 'calendar';if(min>=1020&&min<1140)return 'meals';return 'night';}
function setUI(mode){
const el=document.getElementById('stage');el.replaceChildren();
if(mode==='weather'){const f=document.createElement('iframe');f.id='frame';f.src=BASE+'&refresh='+Date.now();f.title='Children clothing recommendations for Ottawa';el.appendChild(f);return;}
const view=document.createElement('section');view.className='view';el.appendChild(view);
if(mode==='calendar')view.innerHTML='<div class="small">09:00–17:00 · FAMILY SCHEDULE</div><h1 class="big">📅 Today\'s calendar</h1><div class="card"><h2>Google Calendar is not connected yet</h2><p class="hint">Your private events are not published here. Next step: connect a secure, read-only calendar feed through a protected backend.</p><p class="notice">Do not publish private calendar links, tokens, passwords or Google OAuth refresh tokens in this public GitHub repository.</p></div>';
else if(mode==='meals')view.innerHTML='<div class="small">17:00–19:00 · FAMILY MEAL IDEAS</div><h1 class="big">🍲 What should we cook?</h1><div class="card"><h2>Muse Spark integration pending</h2><p class="hint">This is the future place for lunch and dinner ideas with ingredients, preparation time and dietary preferences.</p><p class="notice">The Meta API requires a private server-side key. No live AI recommendations are connected yet.</p></div>';
else view.innerHTML='<div class="small">FAMILY EVENING</div><div class="clock" id="large-clock">--:--</div><h1>🌙 Good evening!</h1><p class="dim">The screen can be put to sleep by Fully Kiosk at your chosen time.</p>';
}
function render(){const p=parts();document.getElementById('now').textContent=p.weekday+', '+p.month+' '+p.day+' · '+p.hour+':'+p.minute+' · Ottawa';const selected=manual==='auto'?which(p):manual;if(selected!==visible){visible=selected;setUI(selected)}const c=document.getElementById('large-clock');if(c)c.textContent=p.hour+':'+p.minute;for(const b of document.querySelectorAll('[data-mode]')){b.classList.toggle('current',b.dataset.mode===manual);b.setAttribute('aria-pressed',String(b.dataset.mode===manual));}}
for(const b of document.querySelectorAll('[data-mode]'))b.addEventListener('click',()=>{manual=b.dataset.mode;visible='';render()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
setInterval(render,15000);render();
</script>
</body></html>
