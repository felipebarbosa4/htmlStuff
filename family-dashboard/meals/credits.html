<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Créditos das fotos · Family Dash</title><style>body{background:#091424;color:#e8f4ff;font:16px system-ui,-apple-system,Arial,sans-serif;max-width:900px;margin:0 auto;padding:30px}a{color:#82e5d9}li{margin:14px 0;padding:14px;background:#18314a;border:1px solid #405b77;border-radius:10px}img{width:100px;height:75px;object-fit:cover;border-radius:8px;float:left;margin-right:16px}h1{font-size:28px}small{color:#b5c8dc}</style></head><body><a href="/family-dashboard/meals-admin/">← Voltar</a><h1>Créditos das fotos</h1><p>As fotos de exemplo foram adaptadas (redimensionamento/corte) de arquivos do Wikimedia Commons. Os direitos permanecem com seus autores, sob as licenças indicadas.</p><ul id="list"></ul><script>fetch('/family-dashboard/meals/credits.json').then(r=>r.json()).then(items=>{const list=document.getElementById('list');for(const item of items){const li=document.createElement('li');const img=document.createElement('img');img.src='/family-dashboard/meals/photos/'+item.file;img.alt='Foto ilustrativa';const a=document.createElement('a');a.href=item.source;a.textContent=item.title;a.target='_blank';a.rel='noopener';const p=document.createElement('p');p.textContent='Autor: '+(item.author||'Ver arquivo original');const b=document.createElement('a');b.href=item.licenseUrl||item.source;b.textContent='Licença: '+(item.license||'Ver arquivo original');b.target='_blank';b.rel='noopener';li.append(img,a,p,b);list.append(li);}}).catch(()=>document.getElementById('list').textContent='Não foi possível carregar os créditos.');</script></body></html>
